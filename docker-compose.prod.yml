services:
  phr-backend:
    image: health-body-backend:local
    build:
      context: ./backend
    container_name: phr-backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    user: "0:0"
    volumes:
      - /vol2/1000/cloudreve/uploads:/cloudreve/uploads:ro
    ports:
      - "8080:8080"
    depends_on:
      - phr-ocr-worker
    networks:
      - immich_default

  phr-ocr-worker:
    image: health-body-ocr-worker:local
    build:
      context: ./workers/ocr
      args:
        OCR_BASE_IMAGE: ${OCR_BASE_IMAGE:-ai-family-menu-ocr:local}
    container_name: phr-ocr-worker
    restart: unless-stopped
    environment:
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-10}
      OCR_MIN_SCORE: ${OCR_MIN_SCORE:-0.45}
    networks:
      - immich_default

  phr-frontend:
    image: health-body-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://192.168.0.111:8080/api/v1}
    container_name: phr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - phr-backend
    networks:
      - immich_default

networks:
  immich_default:
    external: true
